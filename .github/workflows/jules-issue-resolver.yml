name: Google Jules Autonomous Issue Resolver

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read

jobs:
  jules-resolve:
    name: Dispatch Issue to Google Jules
    runs-on: ubuntu-latest
    # Run if issue is labeled with jules / auto-fix or opened with bug/enhancement
    if: >
      contains(github.event.issue.labels.*.name, 'jules') ||
      contains(github.event.issue.labels.*.name, 'auto-fix') ||
      contains(github.event.issue.labels.*.name, 'bug')
    steps:
      - name: Harden Runner Security
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python Runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Setup Node Runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Dispatch Issue Resolution to Jules Cloud VM
        id: dispatch
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ -z "$JULES_API_KEY" ]; then
            echo "::warning::JULES_API_KEY secret is not configured in this repository. Skipping Jules cloud dispatch."
            exit 0
          fi

          echo "Handing off Issue #$ISSUE_NUMBER to Google Jules..."
          python3 tools/scripts/jules_maintainer.py resolve-issue "$ISSUE_NUMBER" --repo "${{ github.repository }}"

      - name: Comment on Issue
        if: env.JULES_API_KEY != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "${{ github.repository }}" \
            --body "🤖 **Google Jules Autonomous Coding Agent** has been dispatched to investigate and open a resolution Pull Request for this issue. You can track progress in the PR timeline once generated."
