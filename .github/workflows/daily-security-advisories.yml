name: Daily Security Advisories & Vulnerability Audit (Google Jules)

on:
  schedule:
    # Run daily at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  security-events: read

jobs:
  daily-security-audit:
    name: Daily Advisories & SecSDLC Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner Security
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python Runtime
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Setup Node Runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install Vulnerability Audit Tools
        run: |
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.0.0-beta1 2>/dev/null || true
          which osv-scanner || echo "osv-scanner fallback to pip/offline audit"

      - name: Run Stack Detection & Vulnerability Audit
        id: vuln_audit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== 1. Running DevSecOps Master Stack Audit ==="
          python3 skills/devsecops-master/scripts/devsecops_audit.py . --format json > audit_report.json || true
          head -n 30 audit_report.json || true

          echo "=== 2. Checking Open Security Advisories (OSV Scanner) ==="
          if command -v osv-scanner >/dev/null 2>&1; then
            osv-scanner scan --format=json . > osv_results.json || true
          else
            echo '{"results": []}' > osv_results.json
          fi

          echo "=== 3. Querying GitHub Security Advisories API ==="
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/security-advisories" > repo_advisories.json 2>/dev/null || echo '[]' > repo_advisories.json
          cat repo_advisories.json || true

      - name: Dispatch Investigation Task to Google Jules
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$JULES_API_KEY" ]; then
            echo "::warning::JULES_API_KEY is not configured in repository secrets. Skipping Jules dispatch."
            exit 0
          fi

          TODAY=$(date +%Y-%m-%d)
          PROMPT="Act as the Autonomous Security Lead for ${{ github.repository }}.
          Review the daily security vulnerability and advisory telemetry:
          1. Analyze audit_report.json, osv_results.json, and repo_advisories.json.
          2. Check for any newly reported GitHub Security Advisories or upstream CVEs affecting this repository.
          3. Inspect dependency lockfiles (package-lock.json, bun.lock) for reachable vulnerabilities.
          4. If remediations exist, update the affected packages, run \`npm run validate:strict\` and verify test suites pass.
          5. Propose atomic fixes on branch jules/security-advisories-$TODAY via Pull Request titled 'security(deps): daily automated security advisories audit [$TODAY]'. DO NOT merge to main."

          python3 tools/scripts/jules_maintainer.py dispatch "$PROMPT" \
            --title "Daily Security Advisories & Vulnerability Audit ($TODAY)" \
            --repo "${{ github.repository }}"
