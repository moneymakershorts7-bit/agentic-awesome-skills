name: Daily GitHub Wiki & Documentation Sync

on:
  schedule:
    # Run every day at 06:30 UTC (right after the 06:00 UTC daily discovery scout)
    - cron: '30 6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'skills/**'
      - 'data/**'
      - 'docs/**'
      - 'package.json'
      - 'tools/scripts/generate_wiki.py'

permissions:
  contents: write
  actions: read

jobs:
  wiki-sync:
    name: GitHub Wiki Synchronizer
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner Security
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Python Runtime
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Setup Node Runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Project Dependencies
        run: |
          npm ci --ignore-scripts || npm install --no-audit

      - name: Dispatch to Google Jules Maintainer Sentinel
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODAY=$(date +%Y-%m-%d)
          if [ -n "$JULES_API_KEY" ]; then
            echo "Dispatching Daily Wiki & Documentation Sync Sentinel to Google Jules Cloud..."
            curl -s -X POST https://jules.googleapis.com/v1alpha/sessions \
              -H "x-goog-api-key: $JULES_API_KEY" \
              -H "Content-Type: application/json" \
              -d "{
                \"prompt\": \"Act as the Documentation & Wiki Sentinel for agentic-awesome-skills. Execute python3 tools/scripts/generate_wiki.py --sync --token $GITHUB_TOKEN --repo ${{ github.repository }}. Verify all 2,764+ skills, 59 editorial bundles, daily discovery logs, and free-for-dev directory are completely synchronized with the GitHub Wiki. Never commit secrets.\",
                \"title\": \"Daily GitHub Wiki Synchronization ($TODAY)\",
                \"sourceContext\": {
                  \"source\": \"sources/github/${{ github.repository }}\",
                  \"githubRepoContext\": { \"startingBranch\": \"main\" }
                },
                \"automationMode\": \"AUTO_CREATE_PR\"
              }" || echo "Jules API dispatch finished or deferred."
          fi

      - name: Synchronize GitHub Wiki
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Running autonomous GitHub Wiki generator & synchronizer..."
          python3 tools/scripts/generate_wiki.py --sync --token "$GITHUB_TOKEN" --repo "${{ github.repository }}"
