name: Upstream Sync & Hardened Validation (Swiss Army Knife Edition)

on:
  schedule:
    # Run weekly on Sunday at 04:00 UTC
    - cron: '0 4 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  sync-upstream:
    name: Sync Upstream Catalog & Build Hardened Chain
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner Security
        uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.11.0
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Python Runtime
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'

      - name: Setup Node Runtime
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Configure Upstream Remote
        run: |
          git remote add upstream https://github.com/sickn33/agentic-awesome-skills.git || true
          git fetch upstream main

      - name: Merge Upstream Main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          echo "Merging upstream/main into Swiss Army Knife Edition main..."
          git merge upstream/main -m "chore(upstream): sync latest skills and catalog improvements from upstream [$(date +%Y-%m-%d)]" || {
            echo "::error::Merge conflict detected during upstream sync. Please inspect and resolve manually."
            exit 1
          }

      - name: Install Project Dependencies
        run: |
          npm ci --ignore-scripts || npm install --no-audit

      - name: Build Hardened Chain & Offline Catalog
        run: |
          npm run chain
          npm run validate:strict

      - name: Push Synchronized Main
        run: |
          git push origin main
