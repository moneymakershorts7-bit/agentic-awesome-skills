name: Upstream Sync & Hardened Validation (Swiss Army Knife Edition)

on:
  schedule:
    # Run weekly on Sunday at 04:00 UTC
    - cron: '0 4 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  sync-upstream:
    name: Sync Upstream Catalog & Build Hardened Chain
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner Security
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Python Runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Setup Node Runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Configure Upstream Remote
        run: |
          git remote add upstream https://github.com/sickn33/agentic-awesome-skills.git || true
          git fetch upstream main

      - name: Merge Upstream Main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          echo "Merging upstream/main into Swiss Army Knife Edition main..."
          git merge upstream/main -m "chore(upstream): sync latest skills and catalog improvements from upstream [$(date +%Y-%m-%d)]" || {
            echo "::error::Merge conflict detected during upstream sync. Please inspect and resolve manually."
            exit 1
          }

      - name: Install Project Dependencies
        run: |
          npm ci --ignore-scripts || npm install --no-audit

      - name: Build Hardened Chain & Offline Catalog
        run: |
          npm run chain
          npm run validate:strict

      - name: Push Synchronized Main
        run: |
          git push origin main
