name: Google Jules Proactive Maintenance Sentinel

on:
  schedule:
    # Run weekly on Tuesday at 03:00 UTC
    - cron: '0 3 * * 2'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  jules-maintenance:
    name: Autonomous Codebase Sweeper & Optimizer
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner Security
        uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.11.0
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python Runtime
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'

      - name: Setup Node Runtime
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '22'

      - name: Dispatch Proactive Maintenance Task to Jules
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$JULES_API_KEY" ]; then
            echo "::warning::JULES_API_KEY is not set. Skipping Jules cloud proactive maintenance dispatch."
            exit 0
          fi

          TODAY=$(date +%Y-%m-%d)
          PROMPT="Act as the Principal Maintainer for ${{ github.repository }}. Perform a comprehensive repository maintenance sweep:
          1. Review root AGENTS.md directives and coding standards.
          2. Inspect skills/ and tools/ for unresolved #TODO comments, dead reference links, and optimization opportunities.
          3. Validate that all 2,764+ skills conform strictly to frontmatter standards.
          4. Run \`npm run validate:strict\` and verify test suites pass.
          5. Propose clean, atomic improvements on a PR titled 'chore(maintenance): automated Jules repository sweep [$TODAY]'."

          python3 tools/scripts/jules_maintainer.py dispatch "$PROMPT" \
            --title "Weekly Proactive Maintenance ($TODAY)" \
            --repo "${{ github.repository }}"
