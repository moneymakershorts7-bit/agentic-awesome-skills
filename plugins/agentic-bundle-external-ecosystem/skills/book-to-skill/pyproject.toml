[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "book-to-skill"
version = "1.4.0"
description = "Convert books and documents into structured, on-demand agent skills."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.scripts]
book-to-skill = "book_to_skill.cli:main"

[project.optional-dependencies]
html = ["trafilatura>=1.12.0"]
epub = ["ebooklib>=0.18", "beautifulsoup4>=4.12.3"]
pdf = ["pdf-inspector>=1.15,<2", "pypdf>=5.1.0", "pdfminer.six>=20240706"]
docx = ["python-docx>=1.1.2"]
rtf = ["striprtf>=0.0.26"]
all = [
    "trafilatura>=1.12.0",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12.3",
    "pdf-inspector>=1.15,<2",
    "pypdf>=5.1.0",
    "pdfminer.six>=20240706",
    "python-docx>=1.1.2",
    "striprtf>=0.0.26"
]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
