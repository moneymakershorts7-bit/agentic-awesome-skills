---
# ServiceAccount for sec-userspace K8s Job/CronJob
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sec-userspace
  namespace: security-system
  labels:
    app: sec-userspace
    component: node-scanner
---
# ClusterRole with necessary RBAC permissions for node-level security detection
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sec-userspace
  labels:
    app: sec-userspace
    component: node-scanner
rules:
  # Pod information read (for detecting pod security issues)
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]

  # Node information read
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]

  # ConfigMap/Secret read (for detecting credential exposure)
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list"]

  # ServiceAccount read (for SA token abuse detection)
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "list"]

  # Role/ClusterRole read (for RBAC analysis)
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "clusterroles", "rolebindings", "clusterrolebindings"]
    verbs: ["get", "list"]
---
# ClusterRoleBinding to grant permissions to sec-userspace ServiceAccount
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sec-userspace
  labels:
    app: sec-userspace
    component: node-scanner
subjects:
  - kind: ServiceAccount
    name: sec-userspace
    namespace: security-system
roleRef:
  kind: ClusterRole
  name: sec-userspace
  apiGroup: rbac.authorization.k8s.io
