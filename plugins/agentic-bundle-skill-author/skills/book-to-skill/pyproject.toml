[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "book-to-skill"
version = "1.4.0"
description = "Convert books and documents into structured, on-demand agent skills."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.scripts]
book-to-skill = "book_to_skill.cli:main"

[project.optional-dependencies]
html = ["trafilatura"]
epub = ["ebooklib", "beautifulsoup4"]
pdf = ["pdf-inspector>=1.15,<2", "pypdf>=5.1.0", "pdfminer.six>=20240706"]
docx = ["python-docx>=1.1.2"]
rtf = ["striprtf"]
technical = ["docling>=2.15.0"]
all = [
    "trafilatura",
    "ebooklib",
    "beautifulsoup4",
    "pdf-inspector>=1.15,<2",
    "pypdf>=5.1.0",
    "pdfminer.six>=20240706",
    "python-docx>=1.1.2",
    "striprtf",
    "docling>=2.15.0"
]


# Tooling config so `ruff check .` and `pytest` locally match CI without flags.
[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
# High-value gate only: syntax errors (E9) + pyflakes (F). Style stays ungated.
select = ["E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
